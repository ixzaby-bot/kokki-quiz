<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#dff4ff"><title>こっきクイズ！</title>
<link rel="icon" href="./assets/icon.svg"><link rel="apple-touch-icon" href="./assets/icon-192.png"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"></head>
<body><header><div class="brand"><img src="./assets/icon.svg" width="44" height="44" alt=""><h1>こっきクイズ<span>！</span></h1></div>
<label class="level"><span aria-hidden="true">⚙</span><select id="level" aria-label="むずかしさ"><option value="easy">かんたん</option><option value="normal">ふつう</option><option value="world">せかい</option><option value="expert">ちょうむずかしい</option></select></label></header>
<main><div class="scorebar"><div><b class="star" aria-hidden="true">★</b> せいかい <strong id="score">0</strong></div><div><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ff9568" stroke="#9f492f" stroke-width="1.5" d="M12 2c1 6-4 6-3 11-2-1-3-3-3-5-5 6-3 14 6 14 8 0 11-9 6-15 0 3-1 4-2 5 0-4-1-7-4-10Z"/></svg> れんぞく <strong id="streak">0</strong></div></div>
<section class="ticket" aria-labelledby="question"><div class="tickethead"><span class="round"><i></i> もんだい <b id="number">01</b></span><span class="progress"><b id="step">01</b> / <span id="total">20</span></span></div>
<h2 id="question" tabindex="-1">どこの こっきかな？</h2>
<div class="scene"><img id="flag" alt="このこっきの くにを えらんでね" hidden></div></section>
<div id="choices" aria-label="こたえ"></div><div id="feedback" role="status"></div><button id="next" hidden>つぎのもんだい <span>→</span></button>
<small id="offline" role="status"></small></main><script type="module" src="./app.mjs"></script></body></html>
